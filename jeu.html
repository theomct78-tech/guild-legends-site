<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1c13">
<title>Repère Guild Legends</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@700;800&family=Alegreya+Sans:wght@400;500;700;800&family=Alegreya:ital,wght@1,500&display=swap">
<style>
/* Mise en page : une appli de poche, une colonne de 440 px au plus, quatre onglets en bas. Le repère la nuit, à la lueur des lanternes : un seul thème, sombre et chaud, choisi exprès. */
:root {
  --nuit: #1b130e; --bois: #281d15; --bois-haut: #33261c; --bois-clair: #3f2f23;
  --lin: #f4e7d4; --cendre: #b8a28a; --miel: #f2b65e; --miel-doux: rgba(242, 182, 94, .16);
  --sauge: #95cfa5; --braise: #ec7d63; --nuit-voile: rgba(14, 9, 6, .72);
  --f-titre: "Alegreya SC", Georgia, serif; --f-ui: "Alegreya Sans", "Trebuchet MS", sans-serif; --f-plume: "Alegreya", Georgia, serif;
  --r-carte: 22px; --r-petit: 14px; --ombre: 0 10px 30px rgba(0, 0, 0, .35), 0 2px 6px rgba(0, 0, 0, .25);
  --ressort: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1.004 83.8%, 1);
  --doux: cubic-bezier(.22, 1, .36, 1);
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: radial-gradient(120% 80% at 50% -10%, #3a2617 0%, var(--nuit) 55%) fixed, var(--nuit); color: var(--lin); font: 16px/1.45 var(--f-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--nuit); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--miel); outline-offset: 3px; border-radius: 12px; }
.app { max-width: 440px; margin: 0 auto; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px calc(110px + env(safe-area-inset-bottom, 0px)); }
.ecran { display: grid; gap: 26px; }
.ecran[hidden] { display: none; }
.entre > * { animation: monte .55s var(--doux) both; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes monte { from { opacity: 0; transform: translateY(14px) scale(.98); } }
h1 { font: 800 1.9rem/1.05 var(--f-titre); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h2 { font: 800 1.15rem/1.2 var(--f-titre); margin: 0; letter-spacing: .02em; }
p { margin: 0; }
.bloc { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.tete-bloc { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.discret { color: var(--cendre); font-size: .9rem; }
.pastille { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; background: var(--bois-haut); font-size: .82rem; font-weight: 700; color: var(--cendre); white-space: nowrap; }
.pastille.miel { background: var(--miel-doux); color: var(--miel); }
/* Accueil */
.marque { font: 800 .78rem var(--f-titre); letter-spacing: .14em; text-transform: uppercase; color: var(--miel); }
.accueil { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.coffre { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 99px; background: var(--bois); box-shadow: var(--ombre); font-weight: 800; font-variant-numeric: tabular-nums; }
.piece { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe3a3, var(--miel) 55%, #a8661f); box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
/* Histoires (stories) */
.rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -16px; padding: 4px 16px 10px; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
/* Plis */
.pli { position: relative; display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center; padding: 14px; border-radius: var(--r-carte); background: linear-gradient(160deg, var(--bois-haut), var(--bois)); box-shadow: var(--ombre); text-align: left; transition: transform .4s var(--ressort); width: 100%; }
.pli:active { transform: scale(.98); }
.sceau { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f08e74, #b6402c 60%, #7e2618); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25), 0 3px 8px rgba(0,0,0,.4); display: grid; place-items: center; color: #ffd9cc; font: 800 .9rem var(--f-titre); }
.duo { position: relative; width: 56px; height: 56px; }
.duo img { position: absolute; width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--bois-haut); object-fit: cover; }
.duo img:first-child { top: 0; left: 0; } .duo img:nth-child(2) { bottom: 0; right: 0; }
.duo img:only-child { width: 56px; height: 56px; position: static; }
.sceau.brise { animation: brise .32s var(--doux) forwards; }
@keyframes brise { 40% { transform: scale(1.25) rotate(-12deg); } to { transform: scale(.2) rotate(40deg); opacity: 0; } }
.pli b { display: block; font-weight: 800; line-height: 1.2; }
.pli small { color: var(--cendre); }
/* Avatars et anneau de moral */
.avatar { --m: 60; position: relative; width: 58px; height: 58px; border-radius: 50%; padding: 3px; background: conic-gradient(var(--teinte, var(--miel)) calc(var(--m) * 1%), var(--bois-clair) 0); flex: none; }
.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--nuit); display: block; }
.avatar.absent img { filter: grayscale(.8) brightness(.7); }
.presents { display: flex; gap: 14px; overflow-x: auto; margin-inline: -16px; padding: 4px 16px 6px; scrollbar-width: none; }
.present { display: grid; justify-items: center; gap: 6px; width: 66px; flex: none; text-align: center; }
.present small { font-size: .74rem; color: var(--cendre); line-height: 1.15; }
.present b { font-size: .82rem; }
/* Arcs en cours */
.arc { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-carte); background: var(--bois); }
.points { display: flex; gap: 5px; margin-top: 6px; }
.points i { width: 22px; height: 6px; border-radius: 6px; background: var(--bois-clair); }
.points i.fait { background: var(--miel); }
/* Grille des héros */
.grille { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fiche { position: relative; aspect-ratio: 3 / 4; max-width: 100%; border-radius: var(--r-carte); overflow: hidden; box-shadow: var(--ombre); transition: transform .45s var(--ressort); text-align: left; background: var(--bois); }
.fiche:active { transform: scale(.96); }
.fiche > img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; }
.fiche::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(12,8,5,.95)); }
.fiche .bas { position: absolute; z-index: 1; left: 12px; right: 58px; bottom: 12px; display: grid; gap: 2px; }
.fiche .bas b { font: 800 1.1rem var(--f-titre); }
.fiche .moralette { position: absolute; z-index: 1; bottom: 12px; right: 12px; }
.mini { --m: 60; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--teinte, var(--miel)) calc(var(--m) * 1%), rgba(255,255,255,.15) 0); font: 800 .8rem var(--f-ui); position: relative; }
.mini::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: rgba(20,13,9,.85); }
.mini span { position: relative; }
/* Chronique */
.filtres { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.filtres button { padding: 8px 14px; border-radius: 99px; background: var(--bois); font-weight: 700; font-size: .9rem; color: var(--cendre); transition: background .3s var(--doux), color .3s var(--doux); white-space: nowrap; }
.filtres button[aria-pressed="true"] { background: var(--miel); color: var(--nuit); }
.jour { display: grid; gap: 10px; }
.jour h3 { margin: 6px 0 0; font: 800 .8rem var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--cendre); }
.moment { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.moment .tetes { position: relative; height: 44px; }
.moment .tetes img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid var(--nuit); position: absolute; top: 0; left: 0; }
.moment .tetes img + img { top: 14px; left: 12px; width: 30px; height: 30px; }
.bulle { padding: 10px 13px; border-radius: 4px 18px 18px 18px; background: var(--bois); font-size: .95rem; }
.bulle.fort { background: linear-gradient(160deg, var(--bois-haut), var(--bois)); box-shadow: inset 0 0 0 1px rgba(242,182,94,.35); }
.bulle .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; color: var(--cendre); font-size: .78rem; font-weight: 700; }
.icone-evt { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--miel-doux); color: var(--miel); }
/* Feuille (bottom sheet) */
.voile { position: fixed; inset: 0; z-index: 40; background: var(--nuit-voile); backdrop-filter: blur(4px); opacity: 0; transition: opacity .35s var(--doux); }
.voile.ouvert { opacity: 1; }
.feuille { position: fixed; z-index: 41; left: 50%; bottom: 0; width: min(440px, 100%); max-height: 88vh; overflow-y: auto; transform: translate(-50%, 110%); visibility: hidden; transition: transform .5s var(--ressort), visibility 0s .5s; border-radius: 28px 28px 0 0; background: var(--bois); box-shadow: 0 -10px 40px rgba(0,0,0,.5); padding: 0 max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); overscroll-behavior: contain; }
.feuille.ouvert { transform: translate(-50%, 0); visibility: visible; transition: transform .5s var(--ressort), visibility 0s; }
.poignee { position: sticky; top: 0; z-index: 2; display: grid; place-items: center; height: 26px; margin-inline: -18px; background: var(--bois); touch-action: none; cursor: grab; }
.poignee::before { content: ""; width: 42px; height: 5px; border-radius: 5px; background: var(--bois-clair); }
.banniere { margin-inline: -18px; height: 220px; position: relative; overflow: hidden; }
.banniere img { width: 100%; height: 100%; object-fit: cover; }
.banniere::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, var(--bois)); }
.contenu-feuille { display: grid; gap: 18px; margin-top: -40px; position: relative; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 11px; border-radius: 99px; background: var(--bois-haut); font-size: .86rem; font-weight: 700; }
.chip.plus { background: rgba(149,207,165,.14); color: var(--sauge); }
.chip.moins { background: rgba(236,125,99,.14); color: var(--braise); }
.jauges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; text-align: center; }
.jauge { display: grid; justify-items: center; gap: 6px; font-size: .76rem; color: var(--cendre); font-weight: 700; }
.jauge svg { width: 54px; height: 54px; transform: rotate(-90deg); }
.jauge circle { fill: none; stroke-width: 6; }
.jauge .fond { stroke: var(--bois-clair); }
.jauge .val { stroke: var(--miel); stroke-linecap: round; stroke-dasharray: 138.2; stroke-dashoffset: 138.2; transition: stroke-dashoffset 1s var(--doux) .15s; }
.jauge .val.bas { stroke: var(--braise); }
.liens { display: flex; gap: 14px; overflow-x: auto; scrollbar-width: none; }
.lien { display: grid; justify-items: center; gap: 4px; flex: none; width: 60px; font-size: .74rem; color: var(--cendre); text-align: center; }
.lien .avatar { width: 50px; height: 50px; }
.grand-moral { display: flex; align-items: center; gap: 14px; }
.grand-moral .mini { width: 64px; height: 64px; font-size: 1.15rem; }
.lettre { padding: 16px 18px; border-radius: var(--r-petit); background: var(--lin); color: #3a2a1c; font: italic 500 1.05rem/1.5 var(--f-plume); box-shadow: inset 0 0 30px rgba(120,80,40,.18); }
.reponses { display: grid; gap: 8px; }
.reponses button { padding: 14px 16px; border-radius: 16px; background: var(--bois-haut); font-weight: 800; text-align: left; transition: transform .35s var(--ressort), background .3s; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.reponses button:active { transform: scale(.97); }
.reponses button.defaut::after { content: "par défaut"; font-size: .72rem; font-weight: 700; color: var(--cendre); }
.suite { display: grid; gap: 6px; padding: 14px; border-radius: 16px; background: var(--miel-doux); }
.suite p { font-size: .95rem; }
.vues { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 16px; background: var(--bois-haut); position: relative; }
.vues button { position: relative; z-index: 1; padding: 9px 0; border-radius: 12px; font-weight: 800; font-size: .9rem; color: var(--cendre); transition: color .3s var(--doux); }
.vues button[aria-pressed="true"] { color: var(--nuit); }
.vues .glisse { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 12px; background: var(--miel); transition: transform .45s var(--ressort); }
.vues.combat .glisse { transform: translateX(100%); }
.stat { display: grid; grid-template-columns: 7.5rem 1fr 2.6rem; gap: 10px; align-items: center; font-size: .88rem; }
.stat .barre { height: 8px; border-radius: 8px; background: var(--bois-clair); overflow: hidden; }
.stat .barre i { display: block; height: 100%; width: 0; border-radius: 8px; background: linear-gradient(90deg, var(--miel), #ffd28e); transition: width .9s var(--doux); }
.stat b { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.etoile { color: var(--miel); margin-right: 3px; text-shadow: 0 0 8px rgba(242,182,94,.7); }
.stat small { grid-column: 2 / 4; margin-top: -6px; color: var(--miel); font-weight: 700; font-size: .74rem; }
.epreuve { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--bois-haut); }
.epreuve .pct { font-weight: 800; font-variant-numeric: tabular-nums; }
.potentiel { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 16px; background: linear-gradient(140deg, rgba(242,182,94,.18), rgba(242,182,94,.04)); }
.potentiel .sceau-pot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 800 1.1rem var(--f-titre); background: var(--bois-clair); color: var(--cendre); flex: none; }
.potentiel.revele .sceau-pot { background: radial-gradient(circle at 35% 30%, #ffe3a3, var(--miel) 60%, #a8661f); color: var(--nuit); box-shadow: 0 0 22px rgba(242,182,94,.45); }
.lex { border-bottom: 1.5px dotted var(--miel); cursor: pointer; }
.lex:hover { color: var(--miel); }
.carte-lex { position: fixed; z-index: 71; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: min(400px, calc(100% - 32px)); transform: translate(-50%, calc(100% + 60px)); visibility: hidden; transition: transform .45s var(--ressort), visibility 0s .45s; padding: 18px 18px 16px; border-radius: 24px; background: var(--lin); color: #2c2016; box-shadow: 0 20px 50px rgba(0,0,0,.55); display: grid; gap: 8px; }
.carte-lex.ouvert { transform: translate(-50%, 0); visibility: visible; transition: transform .45s var(--ressort); }
.carte-lex b { font: 800 1.25rem var(--f-titre); }
.carte-lex .reg { justify-self: start; padding: 3px 10px; border-radius: 99px; background: rgba(120,80,40,.14); font-weight: 800; font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; }
.voile-lex { position: fixed; inset: 0; z-index: 70; }
.qui { font-size: .98rem; line-height: 1.5; color: var(--lin); opacity: .92; }
/* Plan du repère */
.plan-cadre { position: relative; border-radius: var(--r-carte); overflow: hidden; background: #241a12; box-shadow: var(--ombre); }
.plan-cadre svg { display: block; width: 100%; height: auto; }
.arrivee-oiseau { position: fixed; inset: 0; z-index: 60; display: grid; place-items: start center; padding: calc(env(safe-area-inset-top) + 70px) 16px 0; background: rgba(12,8,5,.45); border: 0; font: inherit; color: inherit; animation: voile-in .3s ease both; }
.arrivee-oiseau.part { animation: voile-out .45s ease both; }
.oiseau-vol { position: absolute; top: calc(env(safe-area-inset-top) + 18px); left: -80px; width: 72px; animation: traverse 2.2s cubic-bezier(.3,.7,.4,1) both; }
.carte-arrivee { position: relative; display: grid; gap: 8px; justify-items: center; text-align: center; max-width: 340px; margin-top: 30px; padding: 16px 18px; border-radius: 18px; background: linear-gradient(180deg, #f3e6cc, #e9d8b6); color: #2b1d10; box-shadow: 0 10px 30px rgba(0,0,0,.5); font-family: var(--f-plume); animation: carte-in .5s 1.6s cubic-bezier(.2,1.3,.4,1) both; }
.carte-arrivee small { color: #7a5f3c; font-family: var(--f-ui); font-size: .8rem; }
.portail { display: flex; justify-content: center; padding: 6px 14px 0; border-radius: 40px 40px 6px 6px; border: 3px solid #8a6f4e; border-bottom: 0; background: #2b1d10; overflow: hidden; height: 50px; }
.portail img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; margin: 0 -4px; border: 2px solid #f3e6cc; animation: sortie 1.4s 2.2s ease-in both; }
@keyframes traverse { 0% { transform: translate(0, 0) rotate(-6deg); } 60% { transform: translate(calc(50vw + 10px), 34px) rotate(4deg); } 100% { transform: translate(calc(50vw + 40px), 40px) rotate(0); opacity: 0; } }
@keyframes carte-in { from { transform: translateY(-14px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes sortie { to { transform: translateY(44px); opacity: .2; } }
@keyframes voile-in { from { opacity: 0; } } @keyframes voile-out { to { opacity: 0; } }
.sans-mouvement *, .sans-mouvement { animation: none !important; }
.region-carte { cursor: pointer; }
/* Le fil : les héros écrivent eux-mêmes, comme dans une conversation de groupe. */
.bulle.fil { border-radius: 4px 18px 18px 18px; }
.bulle.fil .qui { display: block; font-weight: 800; font-size: .82rem; color: var(--miel); margin-bottom: 1px; }
.bulle.fil .ctx { display: block; font-size: .76rem; color: var(--cendre); margin-bottom: 3px; }
.moment.moi { grid-template-columns: 1fr; justify-items: end; }
.moment.moi .bulle { max-width: 82%; border-radius: 18px 4px 18px 18px; background: var(--miel-doux); color: var(--lin); }
.bulle.fil .geste-fil { color: var(--cendre); } /* les héros qui ne parlent pas (Sona, Bard, Rek'Sai…) : leur geste, en italique */
.repondre-fil { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.repondre-fil button { padding: 6px 12px; border-radius: 99px; background: var(--bois-clair); font-size: .82rem; font-weight: 800; color: var(--lin); }
.bulle.papier { background: linear-gradient(180deg, #f3e6cc, #e9d8b6); color: #2b1d10; border: 0; box-shadow: 0 2px 10px rgba(0,0,0,.35); font-family: var(--f-plume); line-height: 1.5; }
.bulle.papier .meta { color: #7a5f3c; }
.bulle.papier [data-lex] { color: inherit; text-decoration-color: rgba(60,40,20,.4); }
@keyframes pose { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes vol { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-3px) rotate(4deg); } }
.attente.oiseau .quand { animation: vol 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .jeton, .attente.oiseau .quand { animation: none; } .chien-plan { transition: none; } }
.attente { display: flex; gap: 10px; align-items: baseline; font-size: .92rem; }
.attente .quand { flex: none; min-width: 52px; text-align: center; padding: 2px 8px; border-radius: 99px; background: rgba(242,182,94,.14); color: var(--miel); font-weight: 800; font-size: .78rem; }
.rail-cats { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.rail-cats button { flex: none; padding: 7px 12px; border-radius: 99px; border: 1px solid rgba(255,255,255,.12); background: none; color: var(--cendre); font: inherit; font-size: .85rem; font-weight: 700; white-space: nowrap; }
.rail-cats button[aria-pressed="true"] { background: var(--miel); color: #1b130e; border-color: transparent; }
.grille-av { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 8px; }
.grille-av button { padding: 0; border: 0; background: none; } .grille-av img { width: 100%; aspect-ratio: 1; border-radius: 14px; object-fit: cover; display: block; }
.onglets-plan { display: flex; gap: 6px; }
.onglets-plan button { flex: 1 1 auto; min-width: 0; white-space: nowrap; padding: 8px 4px; border-radius: 12px; border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.04); color: var(--cendre); font: inherit; font-size: .85rem; font-weight: 700; position: relative; }
.onglets-plan button[aria-selected="true"] { background: var(--miel); color: #2a1d14; border-color: transparent; }

.puce-meteo { position: absolute; right: 10px; top: 10px; z-index: 2; padding: 3px 9px; border-radius: 99px; background: rgba(20,14,10,.72); color: #f1e6d4; font-size: .74rem; font-weight: 700; pointer-events: none; }

.dit-plan { position: absolute; z-index: 4; width: max-content; max-width: 210px; white-space: normal; overflow-wrap: break-word; text-align: left; translate: -14px calc(-100% - 26px); padding: 7px 10px; border-radius: 12px 12px 12px 3px; background: #f4ead8; color: #2a1d14; font-size: .8rem; line-height: 1.3; box-shadow: 0 3px 10px rgba(0,0,0,.45); pointer-events: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; } }
.pastille.rang{background:rgba(201,164,106,.18);color:#e0c79d;font-weight:800;letter-spacing:.04em}

<script type="module">
/* En ligne (jeu.html), window.GL parle au serveur ; sans lui, c'est la démonstration, avec ses données intégrées. */
const EN_LIGNE = Boolean(window.GL);
// En ligne : si le serveur ne répond pas, on le dit (au lieu d'une page vide), avec l'erreur exacte et un bouton pour réessayer.
let D;
if (EN_LIGNE) {
  try { D = await window.GL.charger(); }
  catch (e) {
    document.body.insertAdjacentHTML('beforeend', `<div style="position:fixed;inset:0;z-index:9999;background:#1f150e;color:#f6e7cf;display:grid;place-content:center;gap:14px;padding:24px;text-align:center;font:17px/1.5 'Alegreya Sans',system-ui,sans-serif">
      <b style="font:800 24px 'Alegreya SC',Georgia,serif;color:#f0a43a">Le repère ne répond pas</b>
      <span>Le serveur du jeu n'a pas pu être joint. Réessaie dans un instant.</span>
      <code style="font-size:13px;opacity:.7;overflow-wrap:anywhere">${String(e && e.message || e).replace(/[<>&]/g, '')}</code>
      <button type="button" onclick="location.reload()" style="justify-self:center;min-height:46px;padding:0 22px;border:0;border-radius:10px;background:#f0a43a;color:#2a1c13;font-weight:700;font-size:16px">Réessayer</button></div>`);
    throw e;
  }
} else D = {};
const IMG = {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const H = id => D.heros.find(h => h.id === id) || D.etrangers?.[id] || (D.candidatures || []).find(c => c.cle === id);
const NOM = id => H(id)?.nom || id;
const cap = t => t ? t.charAt(0).toUpperCase() + t.slice(1) : '';
const GUILDE = id => D.guildes.find(g => g.id === id);
let chien = D.chien;
// Images : intégrées dans la démo ; en ligne, un fichier par héros (tools/images.py), nommé d'après sa fiche.
const fichier = (id, type) => H(id)?.img?.[type] || '';
const av = id => IMG[id]?.av || fichier(id, 'av');
const ban = id => IMG[id]?.ban || fichier(id, 'carte');
const carte = id => IMG[id]?.carte || ban(id);
const story = id => IMG[id]?.story || fichier(id, 'story') || ban(id);
const pos = id => IMG[id]?.pos || '50% 30%';
const teinte = m => m >= 62 ? 'var(--sauge)' : m >= 45 ? 'var(--miel)' : 'var(--braise)';
const ROLES = { Tank: 'Tank', Combattant: 'Combattant', Mage: 'Mage', Tireur: 'Tireur', Assassin: 'Assassin', Support: 'Support' };
const MOT = { or: "L'or", gloire: 'La gloire', cause: 'Une cause', vengeance: 'La vengeance', savoir: 'Le savoir', proteger: 'Protéger', pouvoir: 'Le pouvoir', liberte: 'La liberté', redemption: 'La rédemption', appartenance: 'Trouver sa place', plaisir: 'Le plaisir' };
const LIEN = { famille: 'Famille', amour: 'Amour', ami: 'Ami', rival: 'Rival', ennemi: 'Ennemi', mentor: 'Maître/élève' };
const repondues = {};
let titre = 'maître', billetsDoux = true;
if (EN_LIGNE) { titre = D.guilde.titre; billetsDoux = D.guilde.billetsDoux; }
else try { titre = localStorage.getItem('gl-titre') || 'maître'; billetsDoux = localStorage.getItem('gl-doux') !== 'non'; } catch {}
/* Une action du joueur : en ligne, le serveur l'applique et renvoie la nouvelle vue. Renvoie le résultat, ou null si refusée. */
async function agir(action, donnees = {}) {
  try { const r = await window.GL.agir({ action, ...donnees }); appliquer(r.vue); return r.resultat ?? true; }
  catch (e) { toast(e.message || 'Le serveur n\'a pas répondu.'); return null; }
}
function appliquer(vue) { if (!vue) return; D = vue; chien = D.chien; construites = new Set(D.salles.filter(s => s.etat === 'construite').map(s => s.cle)); for (const k in repondues) delete repondues[k]; rafraichir(); }
if (EN_LIGNE) setInterval(async () => { if (document.hidden || !$('#voile').hidden) return; try { appliquer(await window.GL.charger()); } catch {} }, 5 * 60 * 1000);
const Titre = () => titre[0].toUpperCase() + titre.slice(1);

/* ---------- Repère ---------- */
/* Les stories : une par héros de la guilde (fil.js), la plus récente d'abord. Vue = vue aujourd'hui sur cet appareil. */
const STORIES = () => (D.stories || []).filter(x => H(x.heros));
const cleVues = () => `gl-stories-${EN_LIGNE ? D.guilde.id : 'demo'}-${Math.floor((D.maintenant.t || 0) / 24)}`;
let storiesVues = new Set();
try { storiesVues = new Set(JSON.parse(localStorage.getItem(cleVues()) || '[]')); } catch {}
const storyVue = x => storiesVues.has(`${x.heros}@${x.derniere}`);
function marquerStory(x) { storiesVues.add(`${x.heros}@${x.derniere}`); try { localStorage.setItem(cleVues(), JSON.stringify([...storiesVues])); } catch {} }
function railStories() {
  const st = STORIES(); if (!st.length) return '';
  // Celles qu'on n'a pas encore vues d'abord, comme sur Instagram.
  const ordre = [...st.filter(x => !storyVue(x)), ...st.filter(storyVue)];
  return `<div class="stories" style="--i:1" role="list" aria-label="Les stories de la guilde">${ordre.map(x => `<button type="button" role="listitem" class="story-bulle ${storyVue(x) ? 'vue' : ''}" data-story="${esc(x.heros)}"><span class="anneau"><img src="${av(x.heros)}" alt=""></span><span>${esc(NOM(x.heros).split(' ')[0])}</span></button>`).join('')}</div>`;
}
function repere() {
  const ouvertes = D.cartes.filter(c => !repondues[c.id]);
  const presents = D.heros;
  $('#e-repere').innerHTML = `
  <div class="accueil" style="--i:0"><div style="flex:1;min-width:0">${EN_LIGNE ? `<button type="button" data-ma-guilde aria-label="L'image de ta guilde" style="padding:0;border:0;background:none;vertical-align:middle;margin-right:8px">${blasonMoi(30)}</button>` : ''}<span class="marque">Guild Legends</span><span class="discret"> · ${esc(D.maintenant.jour)}, ${D.maintenant.heure} h</span><h1>Bon retour,<br>${titre}</h1></div><div class="coin"><button type="button" class="aide" data-guide="" aria-label="Comment ça marche">?</button><div class="coffre" title="Pièces d'or"><span class="piece"></span>${D.po.toLocaleString('fr-FR')} <small>PO</small></div></div></div>

  ${blocCarnet()}

  ${(D.avis || []).length ? `<div class="bloc" style="--i:1"><h2>Les nouvelles</h2>${D.avis.slice(0, 4).map(a => `<p class="discret" style="margin:0"><b style="color:var(--lin)">${esc(a.jour)}, ${a.heure} h</b> · ${annoter(a.texte)}</p>`).join('')}</div>` : ''}
  ${(D.aVenir || []).length ? `<div class="bloc" style="--i:1"><div class="tete-bloc"><h2>Ce qui t'attend</h2><button type="button" class="aide" data-explique="avenir" aria-label="Ce qui t'attend">?</button></div>${D.aVenir.map(x => `<div class="attente ${x.type}"><span class="quand">${x.dans <= 0 ? 'bientôt' : x.dans >= 24 ? `${Math.round(x.dans / 24)} j` : `${x.dans} h`}</span><span>${esc(x.texte)}</span></div>`).join('')}</div>` : ''}
  <div class="bloc" style="--i:1"><div class="tete-bloc"><h2>Ton repère</h2><span class="discret">${presentsRepere().length > 1 ? `${presentsRepere().length} héros présents` : presentsRepere().length ? 'un héros présent' : 'personne'}</span></div>${planRepere()}</div>

    ${ouvertes.length ? ouvertes.map(pli).join('') : '<div class="vide">Rien à signer. Profite du calme.</div>'}</div>
  ${D.arcs.length ? `<div class="bloc" style="--i:4"><h2>Histoires en cours</h2>${D.arcs.map(a => `<div class="arc"><span class="duo"><img src="${av(a.a)}" alt=""><img src="${av(a.b)}" alt=""></span><div style="min-width:0"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(a.titre)}</b><span class="pastille miel">À suivre</span></div><div class="discret">${esc(NOM(a.a))} et ${esc(NOM(a.b))}</div>${a.dernier && a.total ? `<p class="discret" style="margin-top:6px;font-style:italic">« ${annoter(a.dernier.length > 120 ? a.dernier.slice(0, 118).replace(/\s\S*$/, '') + '…' : a.dernier)} »</p>` : ''}<div class="points">${Array.from({ length: (a.total || a.etape) + 1 }, (_, k) => `<i class="${k < a.etape ? 'fait' : ''}"></i>`).join('')}</div></div></div>`).join('')}</div>` : ''}
  ${D.soiree ? `<div class="bloc" style="--i:5"><div class="tete-bloc"><h2>La soirée de ${esc(D.soiree.jour)}</h2><span class="discret">${D.soiree.venus.length > 1 ? `${D.soiree.venus.length} présents` : D.soiree.venus.length ? 'un présent' : 'personne pour l\'instant'}</span></div>

 */
const SVG_CHIEN = '<svg viewBox="0 0 24 24" fill="#c99a62"><ellipse cx="12" cy="15" rx="5" ry="4.2"/><circle cx="6" cy="9" r="2.1"/><circle cx="10" cy="6.2" r="2.1"/><circle cx="14" cy="6.2" r="2.1"/><circle cx="18" cy="9" r="2.1"/></svg>';

const ZONES = {

};
/* Où se tient un héros selon ce qu'il fait : des places précises dans chaque pièce, puis des places libres. */
const PLACES = {

// L'état d'un héros, en mots. Chaque état s'explique au toucher (EXPLIQUE, plus bas).
function ETAT_HEROS(h) {
  if (h.etat === 'mission') return 'En mission';
  if (h.etat === 'rappel') return 'Rappelé, sur le retour';
  if (h.etat === 'voyage') return 'En voyage';
  if (h.etat === 'conges') return 'En congés';
  if (h.reserve) return 'En salle de brief';
  if (h.blesse) return 'Blessure, en soins';
  if (h.repos) return `Au repos · ${h.repos} h`;
  return esc(ROLES[h.role] || h.role);
}

/* L'équipe conseillée : pour chaque poste libre, le héros disponible qui donne les meilleures chances, sans prendre deux fois le même. */
function conseil(c) {
  const pris = new Set(), out = [];
  c.detailPostes.forEach((p, i) => { if (p.tenu) return;
    const x = (p.candidats || []).filter(k => k.dispo && !pris.has(k.id)).sort((a, b) => (b.chance ?? 0) - (a.chance ?? 0) || a.ecart - b.ecart)[0];
    if (x) { pris.add(x.id); out.push({ poste: i, heros: x.id }); } });
  return out;
}

/* ---------- Le guide du maître ----------
 * Tout le jeu en six cartes courtes, ouvrables depuis le « ? » de l'accueil, ou à l'endroit précis où une règle s'applique.
 */
const GUIDE = [
  ['role', '👑', 'Ton rôle', "Tu diriges une guilde. Tes héros vivent leur vie sans toi : ils s'entraînent, se disputent, s'attachent. Toi, tu choisis les missions, tu réponds au courrier et tu agrandis le repère. Chaque réponse est jugée : être dur, juste, à l'écoute ou généreux ne plaît pas à tout le monde."],
  ['heros', '❤', 'Moral, fidélité, estime', "Le moral dit comment un héros va aujourd'hui. La fidélité, s'il compte rester. L'estime, ce qu'il pense de toi. Un héros qui t'estime ose te confier sa quête personnelle ; un héros trop malheureux finit par écrire sa lettre de départ."],
  ['missions', '⚔', 'Les missions', "La Chambre des Bannières publie des contrats. Une mission compte l'aller, le temps sur place et le retour : jamais plus de 48 h en tout. Plus c'est loin, moins on reste sur place. Au début, ça rapporte peu de pièces d'or (PO). Quelques missions « à risque » paient bien mieux, mais on y rentre plus souvent blessé."],
  ['repos', '☾', 'Le repos', "Au retour, un héros doit récupérer avant de repartir. Le repos dépend de la durée de la mission, de sa dureté, de son issue et des blessures : quelques heures après une course facile, jusqu'à trois jours après un échec sanglant. Il reste au repère pendant ce temps."],
  ['rangs', '★', 'Les rangs', "Chaque héros a un rang sur chaque poste, de E à G, selon ce qu'il vaut aujourd'hui. Une recrue part quelques rangs sous son potentiel, et monte en progressant. Chaque contrat a aussi un rang : celui qu'il faut, à chaque poste, pour avoir de bonnes chances. Envoyer un héros plus faible n'est jamais interdit, mais chaque rang manquant rend la mission plus dure. Et tant que le recrutement est ouvert, une autre guilde qui envoie un héros de meilleur rang peut te reprendre un poste que tu tiens sous le rang du contrat. À rang égal, ou si ton héros a déjà le rang demandé, le premier placé garde sa place."],
  ['equipement', '⚔', "L'équipement", "Les missions réussies peuvent rapporter un objet. Il rejoint l'inventaire, et tu choisis qui le porte : deux objets par héros. Un objet améliore des statistiques, sans jamais dépasser les limites du héros : il ne change pas son potentiel. Les potions soignent (moins de repos), les élixirs servent pour la prochaine mission. Quand un héros part, son équipement revient à l'inventaire."],
  ['territoires', '⚑', 'Les territoires', "Chaque région de Runeterra peut être tenue par une guilde. Ton influence dans une région, c'est la réputation que tu y as gagnée en mission sur les quatre dernières semaines. Chaque lundi midi, on recompte : la guilde la plus influente tient la région, et pour la lui reprendre il faut 10 % d'influence de plus qu'elle. Tenir une région : contrats mieux payés là-bas (+10 %), un contrat de plus chaque jour, et le moral des héros qui aiment cette région."],
  ['tournoi', '🏆', 'Le tournoi', "Un tournoi par mois, le premier samedi à 18 h. Chaque guilde inscrit trois héros et paie des frais selon son palier ; la Chambre ajoute sa part à la cagnotte. Jusqu'à six équipes, tout le monde se rencontre ; au-delà, élimination directe. Un match se joue en trois manches : un combat, une épreuve tirée au hasard, un combat. Gains : 60 % de la cagnotte au vainqueur, 30 % au deuxième, 10 % au troisième, et de la réputation."],
  ['alliances', '🤝', 'Les alliances', "Deux guildes peuvent s'allier : une au palier Inconnue, deux ensuite, trois à la Renommée. Des héros de guildes alliées qui se croisent en mission s'entendent mieux, ce qui aide l'équipe. Une alliance se rompt avec 48 h de préavis, puis il faut attendre deux semaines pour se réallier."],
  ['registre', '📜', 'Le Registre', "Les héros qui quittent une guilde vont au Registre. Si l'un d'eux t'intéresse, inscris-toi sur sa liste : il te sera proposé, en priorité, à une prochaine montée de niveau. Un héros qui a quitté ta guilde ne reviendra pas chez toi."],
  ['repere', '⌂', 'Le repère', "Le repère a trois niveaux : le rez-de-chaussée, l'étage et l'extérieur, avec la cour et le jardin. Tes héros y apparaissent là où ils sont : touche un portrait pour voir ce qu'il fait et passer un moment avec lui. Six pièces peuvent s'ajouter, une tous les 7 rangs (7, 14, 21, 28, 35, 42), à prix fixe. Chacune est grande et change vraiment la vie de la guilde : touche-la pour lire son effet."],
  ['recrutement', '✉', 'Le recrutement', "À chaque montée de niveau, 3 à 10 héros postulent, au hasard : rien ne garantit le rôle qui te manque. Entre-temps, une candidature spontanée peut arriver (une chance sur dix par jour). Plus ta guilde est réputée et ancienne, plus les grands noms se présentent. Contre des PO, une annonce à la Chambre augmente tes chances d'attirer le rôle voulu à la prochaine montée de niveau."],
  ['guildes', '⚑', 'Les autres guildes', "Tes amis dirigent leurs propres guildes. Vous vous croisez sur les contrats ouverts à tous : chaque poste va au premier qui le prend. Touche un héros allié ou une guilde pour voir sa fiche publique. Son moral et ses secrets restent l'affaire de son maître."],

const COURT = { 'Résistance magique': 'Rés. magique' };

  const c = h.combat; if (!c) return '';
  return `<div class="potentiel ${c.potentiel.revele ? 'revele' : ''}"><span class="sceau-pot">${c.potentiel.revele ? esc(c.potentiel.palier) : '?'}</span><div><b>Potentiel</b><p class="discret">${esc(c.potentiel.texte)}</p></div></div>
  ${h.rang ? `<div class="potentiel" style="background:rgba(201,164,106,.08)"><span class="sceau-pot" style="background:#3a2b1e;color:#e0c79d">${esc(h.rang)}</span><div><b>Rang actuel · ${esc(ROLES[h.role] || h.role)}</b><p class="discret">Ce que vaut ${esc(h.nom)} aujourd'hui à son poste. Il monte avec la progression, jusqu'à son potentiel. <button type="button" class="aide" data-guide="rangs" aria-label="Les rangs" style="display:inline-grid;vertical-align:middle">?</button></p></div></div>` : ''}

  <div class="bloc" style="gap:8px"><h2>Ses chances en mission</h2><p class="discret">Contre une mission ordinaire de ton palier.</p>${c.epreuves.map(e => `<div class="epreuve"><span>${esc(e.label)}</span><span class="pct" style="color:${e.chance >= 70 ? 'var(--sauge)' : e.chance >= 45 ? 'var(--miel)' : 'var(--braise)'}">${e.chance} %</span></div>`).join('')}</div>
  ${h.specialites?.length ? `<div class="chips">${h.specialites.map(s => `<span class="chip">${esc(s)}</span>`).join('')}</div>` : ''}`;

/* ---------- Courrier ---------- */
function courrier() {

  const R = D.recrutement;
  $('#e-courrier').innerHTML = `<h1 style="--i:0">Le courrier</h1>
  <div class="bloc" style="--i:1"><div class="tete-bloc"><h2>Recrutement</h2><button type="button" class="aide" data-guide="recrutement" aria-label="Le recrutement">?</button></div>
    <div class="contrat"><p>Réputation <b>${esc(R.palier)}</b>. À la prochaine montée de niveau, <b>${R.dossiers} héros</b> postuleront. Entre-temps, une candidature spontanée peut arriver chaque jour.</p>
    ${D.annonce ? `<span class="pastille miel" style="justify-self:start">Annonce affichée : ${esc(D.annonce)}</span>` : `<button type="button" class="btn-voir" data-annonce>Chercher un rôle · ${R.prixAnnonce} PO</button>`}</div></div>
  ${(D.candidatures || []).length ? `<div class="bloc" style="--i:1"><h2>À la porte</h2>${D.candidatures.map(c => `<div class="cand ok" style="align-items:flex-start"><img src="${av(c.cle)}" alt=""><span style="flex:1"><b>${esc(c.nom)}</b> <span class="pastille rang">${esc(c.rang)}</span>${c.indice ? ` <span class="pastille">${esc(c.indice)}</span>` : ''}<br><span class="discret">${esc(ROLES[c.role] || c.role)} · ${esc(MOT[c.motivation] || '')} · ${c.salaire} PO par semaine · ${c.fondation ? 'dossier de fondation' : c.spontanee ? 'candidature spontanée' : 'dossier de montée de niveau'} · expire dans ${c.expire} h</span>${c.presentation ? `<span class="discret" style="display:block;margin-top:4px;font-style:italic">${annoter(c.presentation.length > 160 ? c.presentation.slice(0, 158).replace(/\s\S*$/, '') + '…' : c.presentation)}</span>` : ''}</span></div>
    <div style="display:flex;gap:8px;margin:-4px 0 10px 56px">${EN_LIGNE ? `<button type="button" class="btn-plein" data-recruter="${esc(c.cle)}">Accueillir</button><button type="button" class="btn-voir" data-refuser="${esc(c.cle)}">Refuser</button>` : ''}</div>`).join('')}

  ${(D.rapports || []).length ? `<div class="bloc" style="--i:1"><h2>Rapports de mission</h2>${D.rapports.map(r => `<button class="pli" data-rapport="${r.id}"><span class="duo">${r.heros.map(id => `<img src="${av(id)}" alt="">`).join('')}</span><span><b>${esc(r.titre)}</b><small>${esc({ eclatante: 'Un triomphe', reussite: 'Mission réussie', partielle: 'Mission à moitié réussie', echec: 'Mission ratée' }[r.issue])} · ${esc(r.lieu)}</small></span><span class="sceau">${r.lu === false ? '•' : 'G'}</span></button>`).join('')}</div>` : ''}
  <div class="bloc" style="--i:1"><h2>À traiter</h2>${ouvertes.length ? ouvertes.map(pli).join('') : '<div class="vide">Tout est signé.</div>'}</div>
  ${Object.keys(repondues).length ? `<div class="bloc" style="--i:2"><h2>Tes réponses</h2>${D.cartes.filter(c => repondues[c.id]).map(c => `<div class="arc"><span class="duo">${c.heros.map(id => `<img src="${av(id)}" alt="">`).join('')}</span><div><b>${esc(c.options.find(o => o.id === repondues[c.id]).libelle)}</b><div class="discret">${esc(c.titre.replace(/ : « .* »$/, ''))}</div></div></div>`).join('')}</div>` : ''}
  ${D.traitees.length ? `<div class="bloc" style="--i:3"><h2>Restées sans réponse</h2>${D.traitees.map(t => `<div class="arc" style="display:block"><b>${esc(t.titre)}</b><p class="discret">Réponse par défaut : ${esc(t.reponse)}. ${esc(t.consequences.join(' '))}</p></div>`).join('')}</div>` : ''}`;

function ouvrirRapport(id) {

}
function ouvrirCarte(id) {

/* ---------- Chronique ---------- */
let filtre = 'tout';
// Une lettre reçue (correspondant, habitant, héros en voyage, autre guilde) se lit sur du papier, pas dans une bulle.
const LETTRE = e => ['courrier', 'voyage'].includes(e.dec);
function chronique() {
  const garde = e => filtre === 'tout' || (filtre === 'fort' && e.importance >= 3) || (filtre === 'histoires' && (e.arc || e.quete)) || (filtre === 'courrier' && LETTRE(e));
  const jours = [...new Set(D.chronique.filter(e => !e.evt).map(e => e.jour))];
  const lignes = D.chronique.filter(garde);
  $('#e-chronique').innerHTML = `<h1 style="--i:0">La chronique</h1>
  <div class="filtres" style="--i:1" role="group" aria-label="Filtrer">${[['tout', 'Tout'], ['fort', 'Moments forts'], ['courrier', 'Courrier'], ['histoires', 'Histoires']].map(([k, l]) => `<button data-f="${k}" aria-pressed="${filtre === k}">${l}</button>`).join('')}</div>
  ${jours.map((j, i) => { const ls = enFil(lignes.filter(e => e.jour === j).sort((a, b) => a.heure - b.heure)); if (!ls.length) return '';
    return `<div class="jour" style="--i:${i + 2}"><h3>${esc(j)}</h3>${ls.map(e => e.evt
      ? `<div class="moment"><span class="icone-evt">${e.evt === 'mission' ? '⚔' : '✦'}</span><div class="bulle fort"><div class="meta">${e.heure} h</div>${annoter(e.texte)}</div></div>`
      : e.dec === 'fil' ? momentFil(e)
      : `<div class="moment"><span class="tetes">${e.heros.slice(0, 2).map(id => `<img src="${av(id)}" alt="${esc(id)}">`).join('')}</span><div class="bulle ${LETTRE(e) ? 'papier' : e.importance >= 3 ? 'fort' : ''}"><div class="meta">${e.heure} h${LETTRE(e) ? ' · au courrier' : ''}${e.arc ? ` <span class="pastille miel">${esc(e.arc)}</span>` : ''}${e.quete ? ' <span class="pastille miel">Quête</span>' : ''}</div>${annoter(e.texte)}</div></div>`).join('')}</div>`; }).join('')}`;
  $('#e-chronique').querySelector('.filtres').onclick = e => { const b = e.target.closest('button'); if (!b) return; filtre = b.dataset.f; chronique(); };

/* Un message du fil : le héros parle lui-même, avec son nom au-dessus ; les réponses du maître s'alignent à droite. */
// Ta réponse s'affiche juste sous le message auquel elle répond, comme dans une conversation.
function enFil(ls) {
  const rep = ls.filter(e => e.enReponseA && ls.some(x => x.id === e.enReponseA)), out = [];
  for (const e of ls) { if (rep.includes(e)) continue; out.push(e); if (e.id) out.push(...rep.filter(r => r.enReponseA === e.id)); }
  return out;
}
const REPONSES_FIL = [['encourager', 'Encourager'], ['taquiner', 'Taquiner'], ['recadrer', 'Recadrer']];
function momentFil(e) {
  if (e.auteur === 'maitre') return `<div class="moment moi"><div class="bulle fil"><div class="meta">${e.heure} h · Toi</div>${esc(e.texte)}</div></div>`;
  return `<div class="moment"><span class="tetes"><img src="${av(e.auteur)}" alt=""></span><div class="bulle fil ${e.importance >= 3 ? 'fort' : ''}"><span class="qui">${esc(NOM(e.auteur))} <span class="discret" style="font-weight:700">· ${e.heure} h</span></span>${e.contexte ? `<span class="ctx">${esc(e.contexte)}</span>` : ''}${/^\(.*\)$/.test(e.texte) ? `<i class="geste-fil">${annoter(e.texte.slice(1, -1))}</i>` : annoter(e.texte)}${e.attend && EN_LIGNE ? `<div class="repondre-fil" data-fil="${esc(e.id)}">${REPONSES_FIL.map(([k, l]) => `<button type="button" data-choix="${k}">${l}</button>`).join('')}</div>` : ''}</div></div>`;
}

/* Le visionneur de stories : on passe d'une photo à l'autre, puis d'un héros au suivant, comme sur Instagram. */
let file = [], hi = 0, si = 0, minuteur = null;
const ilYa = t => { const d = Math.max(0, (D.maintenant.t || 0) - t); return d < 1 ? 'à l\'instant' : d < 24 ? `il y a ${Math.round(d)} h` : 'hier'; };
function ouvrirHistoire(id) {
  const st = STORIES(); file = [...st.filter(x => !storyVue(x)), ...st.filter(storyVue)];

}
function montrerHistoire() {
  const x = file[hi], sl = x.slides[si]; clearTimeout(minuteur);
  marquerStory(x); document.querySelector(`.story-bulle[data-story="${CSS.escape(x.heros)}"]`)?.classList.add('vue');
  // Une photo par message : la story en hauteur, puis la grande image du héros pour le message suivant.

  <div class="barres">${x.slides.map((_, k) => `<i class="${k < si ? 'fait' : k === si ? 'encours' : ''}" style="--d:${duree}ms"></i>`).join('')}</div>
  <div class="entete"><img src="${av(x.heros)}" alt=""><b>${esc(NOM(x.heros))}</b><span>${ilYa(sl.t)}</span></div>
  <button class="fermer" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <button class="zone g" aria-label="Précédent"></button><button class="zone d" aria-label="Suivant"></button>
  <div class="legende">${sl.contexte ? `<small>${esc(sl.contexte)}</small>` : ''}<p>${esc(sl.texte)}</p></div>`;
  $('#cadre .fermer').onclick = fermerHistoire;
  $('#cadre .zone.g').onclick = precedente;

function fermerHistoire() { clearTimeout(minuteur); $('#histoire').classList.remove('ouvert'); $('#histoire').setAttribute('aria-hidden', 'true'); if ($('#e-repere') && !$('#e-repere').hidden) repere(); }

$('#annuler').onclick = () => { annulerAction?.(); $('#toast').classList.remove('ouvert'); };


/* ---------- Lexique : un toucher sur un mot du monde ouvre sa carte ---------- */
const REGIONS_NOM = { demacia: 'Demacia', noxus: 'Noxus', freljord: 'Freljord', ionia: 'Ionia', piltover: 'Piltover', zaun: 'Zaun', bilgewater: 'Bilgewater', shurima: 'Shurima', targon: 'Targon', ixtal: 'Ixtal', bandle: 'Bandle', monde: 'Runeterra' };
const FORMES = (D.lexique || []).flatMap(e => e.formes.map(f => ({ f, e }))).sort((a, b) => b.f.length - a.f.length);
const lettre = c => c && /[A-Za-zÀ-ÿ-]/.test(c);
function annoter(texte) {
  const pris = [], vus = new Set();
  for (const { f, e } of FORMES) { if (vus.has(e.terme)) continue; let i = texte.indexOf(f);
    while (i >= 0) { const j = i + f.length; if (!lettre(texte[i - 1]) && !lettre(texte[j]) && !pris.some(p => i < p.fin && j > p.debut)) { pris.push({ debut: i, fin: j, e }); vus.add(e.terme); break; } i = texte.indexOf(f, i + 1); } }
  pris.sort((a, b) => a.debut - b.debut);
  let out = '', k = 0;
  for (const p of pris) { out += esc(texte.slice(k, p.debut)) + `<span class="lex" role="button" tabindex="0" data-lex="${esc(p.e.terme)}">${esc(texte.slice(p.debut, p.fin))}</span>`; k = p.fin; }
  return out + esc(texte.slice(k));
}
function ouvrirLex(terme) {
  const e = D.lexique.find(x => x.terme === terme); if (!e) return;
  $('#carte-lex').innerHTML = `<span class="reg">${esc(REGIONS_NOM[e.region] || e.region)}</span><b>${esc(e.terme)}</b><p>${esc(e.definition)}</p>`;
  $('#voile-lex').hidden = false; clearTimeout(minuteur); requestAnimationFrame(() => $('#carte-lex').classList.add('ouvert'));
}
function fermerLex() { $('#carte-lex').classList.remove('ouvert'); $('#voile-lex').hidden = true; if ($('#histoire').classList.contains('ouvert')) minuteur = setTimeout(suivante, 4000); }
$('#voile-lex').onclick = fermerLex;
document.addEventListener('click', e => { const l = e.target.closest('[data-lex]'); if (l) { e.stopPropagation(); ouvrirLex(l.dataset.lex); } }, true);

/* ---------- Tout s'explique au toucher (demande de Théo, 9 nov. 2026) ----------
 * Un chiffre, un état, une jauge, un trait, une raison de moral : on touche, et le jeu explique ce que c'est, d'où ça vient,
 * et ce qu'on peut y faire. Même carte que le lexique. */
const RAISONS_TXT = [
  [/^Épuisement/, 'Son énergie est presque vide : trop de missions, d\'entraînement ou de nuits courtes. Évite de l\'envoyer en mission, et laisse-lui du repos.'],
  [/^Solitude/, 'Personne avec qui parler ces derniers temps. Une soirée au repère, un ami présent, une mission à deux : tout ça aide.'],
  [/^L'impression de stagner/, 'Rien ne le fait progresser en ce moment. Une mission, ou de l\'entraînement, lui redonnent de l\'élan.'],
  [/^L'ennui/, 'Trop de routine. Une sortie en ville, une soirée ou des jeux à la taverne lui changent les idées.'],
  [/^Bien dans son quotidien/, 'Ses besoins sont comblés : repos, compagnie, progrès et détente. Continue comme ça.'],
  [/^Un salaire en dessous/, 'Sa solde est en dessous de ses attentes. Tu peux l\'augmenter depuis sa fiche ; les héros qui aiment l\'or y sont deux fois plus sensibles.'],
  [/^Un bon salaire/, 'Sa solde dépasse ses attentes : ça se voit sur son humeur.'],
  [/proches? au repère/, 'Ses amis sont là. Les liens se tissent à force de vivre, de rire et de combattre ensemble.'],
  [/^Vivre avec/, 'Une relation tendue avec quelqu\'un du repère. Les séparer en mission, ou les réconcilier quand une lettre te le propose, peut arranger les choses.'],
];
const BESOINS_TXT = { energie: 'L\'énergie : elle baisse avec les missions et l\'entraînement, remonte avec le sommeil, les siestes et les bains.', social: 'La compagnie : elle monte avec les discussions, les repas, les soirées. Un héros isolé déprime.', elan: 'Le progrès : l\'envie d\'avancer. Les missions, l\'entraînement et la lecture la nourrissent.', loisir: 'La détente : jeux, ville, musique, jardin. Sans elle, l\'ennui s\'installe.' };
function expliquer(cle, arg) {
  let titre = '', html = '';
  const h = arg ? H(arg.split('#')[0]) : null;
  if (cle === 'moral' && h) {
    titre = `Le moral de ${h.nom} : ${h.moral} sur 100`;
    html = `<p>Le chiffre dans le cercle, c'est le moral. Au-dessus de 70, tout va bien et ça se sent en mission. Entre 45 et 70, c'est correct. En dessous de 45, les chances en mission baissent, et l'envie de partir grandit.</p>
      <p><b>Ce qui pèse en ce moment :</b></p>${(h.raisons || []).map(r => `<p>${r.valeur > 0 ? '+' : '−'}${Math.abs(r.valeur)} · <b>${esc(r.libelle)}</b><br><span class="discret">${esc(raisonTxt(h, r.libelle))}</span></p>`).join('') || '<p class="discret">Rien de particulier.</p>'}`;
  } else if (cle === 'raison' && h) {
    const [, i] = arg.split('#'); const r = h.raisons[+i];
    titre = r.libelle; html = `<p>${esc(raisonTxt(h, r.libelle))}</p>`;
    if (/maître|maîtresse/.test(r.libelle) && h.regard) html += regardTxt(h);
  } else if (cle === 'regard' && h) { titre = `Ce que ${h.nom} pense de toi`; html = regardTxt(h); }
  else if (cle === 'etat' && h) { titre = ETAT_HEROS(h).replace(/<[^>]+>/g, ''); html = `<p>${etatTxt(h)}</p>`; }
  else if (cle === 'besoin') { titre = { energie: 'Énergie', social: 'Compagnie', elan: 'Progrès', loisir: 'Détente' }[arg] || ''; html = `<p>${BESOINS_TXT[arg] || ''}</p>`; }
  else if (cle === 'trait') { titre = arg; html = `<p>Un trait de caractère. Il décide de ce que le héros aime faire au repère, de sa façon de juger tes décisions, et de ses réactions en mission ou dans les lettres. Les traits ne changent pas : on fait avec.</p>`; }
  else if (EXPLI_FIXES[cle]) { [titre, html] = EXPLI_FIXES[cle]; html = `<p>${html}</p>`; }
  else if (cle === 'entente' && h) { const e = (h.ententes || [])[+arg.split('#')[1]]; if (e) { titre = `${h.nom} et ${e.avec}`;
    html = `<p>Pendant « ${esc(e.mission)} », ces deux-là se sont ${e.v > 0 ? (e.v >= 4 ? 'très bien' : 'bien') : (e.v <= -4 ? 'très mal' : 'mal')} entendus.</p><p>La prochaine fois qu'ils feront un contrat ensemble, les chances de réussite ${e.v > 0 ? 'monteront' : 'baisseront'} de <b>${Math.abs(e.v)} %</b>. Ça dépend de leurs caractères et de la façon dont le contrat s'est terminé, et ça se rejoue à chaque contrat commun.</p>`; } }
  else if (cle === 'texte') { const [t, ...x] = arg.split('|'); titre = t; html = `<p>${esc(x.join('|'))}</p>`; }
  if (!titre && !html) return;
  $('#carte-lex').innerHTML = `<b>${esc(titre)}</b>${html}`;
  $('#voile-lex').hidden = false; clearTimeout(minuteur); requestAnimationFrame(() => $('#carte-lex').classList.add('ouvert'));
}
const EXPLI_FIXES = {
  places: ['Les places du repère', "À gauche, le nombre de héros dans ta guilde. À droite, le nombre de lits. Le repère gagne des places quand la guilde monte de rang. Quand il est plein, recruter quelqu'un oblige à laisser partir quelqu'un d'autre."],
  actions: ['La vie de la guilde', "Tu peux organiser plus de cent choses : repas, jeux, concours, sorties, fêtes, travaux, coups de main au bourg. Certaines sont gratuites et immédiates, d'autres coûtent cher ou se préparent plusieurs jours à l'avance. Tous les héros présents en profitent (moral, liens, détente, envie de progresser), et chacun juge ton geste selon son caractère. Deux préparations à la fois au maximum, et pas deux fois la même dans la semaine."],
  missive: ['Les missives', "Ton message part par la voie des airs. L'oiseau met plus ou moins longtemps selon la distance entre vos deux repères : l'autre maître ne le lira qu'à son arrivée. Tu as trois oiseaux : quand ils sont tous en vol, il faut attendre."],
  avenir: ["Ce qui t'attend", "Les prochains rendez-vous de ta guilde, du plus proche au plus lointain : les oiseaux en vol, les départs, les retours, ce que tu as organisé. Le monde avance toutes les deux heures, même quand tu n'es pas là. Reviens à ces moments-là : il y aura quelque chose à lire."],
  route: ['La route', "Le temps qu'il faut à tes héros pour aller de ton repère jusqu'à cette région. Il faut compter autant pour le retour. Les lettres, elles, voyagent par les airs, environ trois fois plus vite."],
  influence: ['Ton influence', "La réputation que ta guilde a gagnée dans cette région en mission, sur les quatre dernières semaines. Chaque lundi midi, la guilde la plus influente prend la région."],
};
function raisonTxt(h, libelle) {
  const t = RAISONS_TXT.find(([rx]) => rx.test(libelle));
  if (t) return t[1];
  if (/maître|maîtresse/.test(libelle)) return libelle.startsWith('Ses griefs') ? `${h.regard?.depart || ''} Ses griefs pèsent sur son moral et sur sa fidélité, tant que tes décisions ne lui font pas changer d'avis.` : 'Ce que tu fais lui plaît. Son estime soutient son moral et sa fidélité.';
  return 'Un souvenir récent, bon ou mauvais. Il pèse moins de jour en jour, puis s\'efface.';
}
function regardTxt(h) {
  const r = h.regard; if (!r) return '';
  return `<p><b>${esc(r.mot)}.</b> ${esc(r.depart)}</p>
    ${r.aime?.length ? `<p>Pour gagner son estime : <b>${esc(r.aime.join(', '))}</b>, quand tu réponds aux lettres et aux demandes.</p>` : ''}
    ${r.deteste?.length ? `<p>Ce qui lui déplaît : <b>${esc(r.deteste.join(', '))}</b>.</p>` : ''}
    ${(r.marques || []).length ? `<p>Ce qui a compté : ${r.marques.map(m => esc(m.texte)).join(' ; ')}.</p>` : ''}
    <p class="discret">Tes décisions sont aussi jugées par les témoins : une même réponse peut plaire aux uns et déplaire aux autres.</p>`;
}
function etatTxt(h) {
  if (h.etat === 'mission') return 'En mission pour un contrat. Le correspondant de la Chambre t\'écrit à l\'arrivée puis à la fin ; suis la route dans l\'onglet Monde.';
  if (h.etat === 'rappel') return 'Rappel envoyé : un oiseau a rattrapé la route, et c\'est le demi-tour. Retour au repère bientôt.';
  if (h.etat === 'voyage') return 'En voyage pour sa quête personnelle. Des lettres arrivent en route.';
  if (h.etat === 'conges') return 'En congés. Retour au repère à la date prévue, reposé.';
  if (h.reserve) return 'En salle de brief : ce héros tient un poste sur un contrat et prépare le départ (cartes, équipement, consignes). Le départ se fait tout seul à l\'heure dite. Tu peux encore annuler depuis le contrat.';
  if (h.blesse) return 'Blessure à soigner. Pas de mission tant que ce n\'est pas guéri ; l\'infirmerie accélère les soins.';
  if (h.repos) return `Au repos encore ${h.repos} h après sa dernière mission. Reste au repère, mais ne peut pas repartir avant d'avoir récupéré.`;
  return 'Disponible : au repère, prêt pour un contrat ou une quête.';
}
document.addEventListener('click', e => { const x = e.target.closest('[data-explique]'); if (x) { e.stopPropagation(); e.preventDefault(); const [cle, ...a] = x.dataset.explique.split(':'); expliquer(cle, a.join(':')); } }, true);
document.addEventListener('keydown', e => { const l = e.target.closest?.('[data-lex]'); if (l && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); ouvrirLex(l.dataset.lex); } if (e.key === 'Escape') fermerLex(); });

/* ---------- Navigation ---------- */
let ecran = 'repere';
/* ---------- Le carnet de l'intendante : les premiers pas, pris par la main ----------
 * Une voix du jeu (l'intendante du repère) guide le nouveau maître pas à pas. Chaque étape se coche toute seule
 * quand le joueur l'a faite ; « Montre-moi » l'emmène au bon endroit et fait briller ce qu'il faut toucher.
 */
const CARNET = [
  EN_LIGNE ? { k: 'recruter', titre: 'Accueillir un premier héros', mot: "Trois dossiers attendent dans le courrier. Lis-les, et ouvre la porte à celui ou celle qui te plaît : un repère vide, ça ne fait peur à personne.", ecran: 'courrier', cible: '[data-recruter]' }
    : { k: 'chien', titre: 'Donner un nom au chien', mot: "Ce chien traîne ici depuis avant ton arrivée. Il lui faut un nom, et il ne le choisira pas tout seul.", ecran: 'repere', cible: '.chien' },
  { k: 'fiche', titre: 'Faire connaissance avec un héros', mot: "Ils t'observent depuis ce matin. Ouvre la fiche de l'un d'eux : tu sauras ce qui pèse sur son moral.", ecran: 'heros', cible: '.fiche' },
  { k: 'lettre', titre: 'Répondre à une lettre', mot: "Il y a du courrier sur ton bureau. Réponds avec soin : ils compareront.", ecran: 'courrier', cible: '.pli' },
  { k: 'contrat', titre: 'Lire un contrat de la Chambre', mot: "Les contrats paient peu au début. Regarde quand même : la route compte autant que le travail.", ecran: 'monde', cible: '.contrat' },
  { k: 'batir', titre: 'Construire une pièce', mot: "Le repère grandit avec ton rang. Chaque pièce a son utilité : choisis ce qui manque le plus à ta guilde.", ecran: 'repere', cible: '.lot' },
];
const carnet = (() => { try { return JSON.parse(localStorage.getItem('gl-carnet') || '{}'); } catch { return {}; } })();
function cocher(k) { if (carnet[k] || !CARNET.some(x => x.k === k)) return; carnet[k] = true; try { localStorage.setItem('gl-carnet', JSON.stringify(carnet)); } catch {}
  const reste = CARNET.filter(e => !carnet[e.k]).length;
  const msg = reste ? `Carnet : « ${CARNET.find(e => e.k === k).titre} » ✓` : "L'intendante range son carnet : tu n'as plus besoin d'elle. Ou presque.";
  // Pas de bandeau par-dessus une feuille ouverte : il attend qu'on la ferme, pour ne rien cacher.
  if (feuille.classList.contains('ouvert')) toastEnAttente = msg; else setTimeout(() => toast(msg), 400); }
let toastEnAttente = null;
function blocCarnet() {
  const fait = CARNET.filter(e => carnet[e.k]).length; if (fait === CARNET.length) return '';
  const act = CARNET.find(e => !carnet[e.k]);
  return `<div class="carnet" style="--i:1"><div class="tete"><span class="portrait">O</span><div><b>Odile, ton intendante</b><div class="discret">Premiers pas · ${fait} sur ${CARNET.length}</div></div></div>
    <p class="mot">« ${esc(act.mot)} »</p>
    ${CARNET.map(e => `<div class="etape-carnet ${carnet[e.k] ? 'fait' : e === act ? 'actuelle' : ''}"><span class="coche">${carnet[e.k] ? '✓' : ''}</span><b style="font-weight:700">${esc(e.titre)}</b>${e === act ? `<button type="button" class="montre" data-montre="${e.k}">Montre-moi</button>` : '<span></span>'}</div>`).join('')}</div>`;
}
document.addEventListener('click', e => {
  const m = e.target.closest('[data-montre]'); if (!m) return;
  const et = CARNET.find(x => x.k === m.dataset.montre);
  document.querySelector(`.onglet[data-e="${et.ecran}"]`).click();
  setTimeout(() => { const c = document.querySelector('#e-' + et.ecran + ' ' + et.cible); if (!c) return; c.scrollIntoView({ block: 'center', behavior: 'smooth' }); c.classList.add('vise-moi'); setTimeout(() => c.classList.remove('vise-moi'), 3800); }, 450);
});
const RENDUS = { repere, heros, monde, courrier, chronique };
if (!EN_LIGNE) setTimeout(() => { let vu = false; try { vu = localStorage.getItem('gl-bienvenue') === '1'; } catch {} if (!vu) bienvenue(); }, 900);
function rafraichir() { RENDUS[ecran](); majChien(); apresPlan(); $('#badge').textContent = D.cartes.filter(c => !repondues[c.id]).length || ''; $('#badge').hidden = !D.cartes.some(c => !repondues[c.id]); }
function aller(e) {
  ecran = e;
  document.querySelectorAll('.onglet').forEach((b, i) => { const on = b.dataset.e === e; b.setAttribute('aria-selected', on); if (on) $('#curseur').style.transform = `translateX(${i * 100}%)`; });
  document.querySelectorAll('.ecran').forEach(s => { const on = s.id === 'e-' + e; s.hidden = !on; s.classList.toggle('entre', on); });
  rafraichir(); window.scrollTo({ top: 0, behavior: 'instant' });
}
document.querySelector('.onglets').onclick = e => { const b = e.target.closest('.onglet'); if (b) aller(b.dataset.e); };
document.addEventListener('click', e => {
  const f = e.target.closest('[data-fiche]'); if (f) { ficheHeros(f.dataset.fiche); return; }
  const rp = e.target.closest('[data-rapport]'); if (rp) { ouvrirRapport(rp.dataset.rapport); return; }
  const c = e.target.closest('[data-carte]'); if (c) { const s = c.querySelector('.sceau'); s?.classList.add('brise'); setTimeout(() => { ouvrirCarte(c.dataset.carte); s?.classList.remove('brise'); }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 300); return; }
  const v = e.target.closest('[data-story]'); if (v) ouvrirHistoire(v.dataset.story);
});
rafraichir();
setTimeout(nouveautes, 700);
</script>
